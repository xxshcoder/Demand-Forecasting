stages:
  prepare:
    cmd: python -m src.data.prepare
    deps:
      - data/raw/train.csv
      - src/data
      - params.yaml
    outs:
      - data/processed/sales.parquet

  features:
    cmd: python -m src.features.build
    deps:
      - data/processed/sales.parquet
      - src/features
      - params.yaml
    outs:
      - data/processed/features.parquet
      - data/reference/train_features.parquet

  train:
    cmd: python -m src.models.train
    deps:
      - data/processed/features.parquet
      - data/processed/sales.parquet
      - src/models/__init__.py
      - src/models/baselines.py
      - src/models/metrics.py
      - src/models/sklearn_models.py
      - src/models/nn.py
      - src/models/train.py
      - params.yaml
    outs:
      - reports/predictions

  evaluate:
    cmd: python -m src.models.evaluate
    deps:
      - reports/train_summary.json
      - reports/predictions
      - data/processed/sales.parquet
      - src/models/evaluate.py
      - params.yaml

  compare:
    cmd: python -m src.models.compare
    deps:
      - reports/evaluation.json
      - src/models/compare.py
      - params.yaml
